catalog:
  typescript: ^7.0.2
  eslint: ^10.8.0
  prettier: ^3.9.6
  prettier-plugin-packagejson: ^3.0.2
  prettier-plugin-tailwindcss: ^0.8.1
  turbo: ^2.10.8
  "@eslint/js": ^10.0.1
  "@next/eslint-plugin-next": ^16.3.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-only-warn: ^1.2.1
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-turbo: ^2.10.8
  globals: ^17.9.0
  typescript-eslint: ^8.66.0

packages:
  - "apps/*"
  - "packages/*"

overrides:
  drizzle-orm: rc

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": false
  "@swc/core": true
  esbuild: true
  msw: true
  prisma: false
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@dimah-s3/core@0.3.0"
  - "@dimah-s3/db@0.3.0"
  - "@dimah-s3/react@0.3.0"
  - "@dimah-s3/server@0.3.0"
  - "@dimah-s3/ui@0.3.0"
  - "@better-auth/core@1.7.0-rc.4"
  - "@better-auth/drizzle-adapter@1.7.0-rc.4"
  - "@better-auth/i18n@1.7.0-rc.4"
  - "@better-auth/kysely-adapter@1.7.0-rc.4"
  - "@better-auth/memory-adapter@1.7.0-rc.4"
  - "@better-auth/mongo-adapter@1.7.0-rc.4"
  - "@better-auth/prisma-adapter@1.7.0-rc.4"
  - "@better-auth/telemetry@1.7.0-rc.4"
  - better-auth@1.7.0-rc.4
  - "@shadcn/react@0.3.0"
